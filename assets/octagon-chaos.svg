<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <rect width="900" height="220" rx="24" fill="#0d1117"/>
  <ellipse cx="450" cy="174" rx="340" ry="26" fill="none" stroke="#30363d" stroke-width="5"/>
  <text x="450" y="38" text-anchor="middle" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="22" font-weight="700">LIVE FROM THE DATA OCTAGON</text>

  <g transform="translate(250 95)">
    <animateTransform attributeName="transform" type="translate" values="250 95;270 92;250 95" dur="1.1s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="18" fill="#ffb86b"/>
    <line x1="0" y1="18" x2="0" y2="70" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="34" x2="46" y2="22" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round">
      <animate attributeName="x2" values="46;78;46" dur=".55s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="37" x2="-36" y2="54" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="70" x2="-26" y2="112" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="70" x2="28" y2="112" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>
    <text x="-38" y="142" fill="#58a6ff" font-family="Arial, sans-serif" font-size="16">CHAOS</text>
  </g>

  <g transform="translate(650 95)">
    <animateTransform attributeName="transform" type="translate" values="650 95;632 98;650 95" dur="1.1s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="18" fill="#ff8fa3"/>
    <line x1="0" y1="18" x2="0" y2="70" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="34" x2="-46" y2="22" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round">
      <animate attributeName="x2" values="-46;-78;-46" dur=".7s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="37" x2="36" y2="54" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="70" x2="-28" y2="112" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="70" x2="26" y2="112" stroke="#f0f6fc" stroke-width="7" stroke-linecap="round"/>
    <text x="-48" y="142" fill="#f778ba" font-family="Arial, sans-serif" font-size="16">BACKPACK</text>
  </g>

  <g transform="translate(450 92)">
    <text x="0" y="0" text-anchor="middle" fill="#ffd866" font-family="Arial, sans-serif" font-size="34">💥</text>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.35;1" dur=".55s" repeatCount="indefinite"/>
  </g>

  <text x="450" y="207" text-anchor="middle" fill="#8b949e" font-family="Arial, sans-serif" font-size="14">No fighters were harmed in the making of this scatter plot.</text>
</svg>